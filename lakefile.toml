name = "leanos"
version = "0.1.0"
defaultTargets = ["LeanOS"]

[[lean_lib]]
name = "LeanOS"
moreLeanArgs = ["-DwarningAsError=true"]

[[lean_exe]]
name = "leanos-oracle"
root = "LeanOS.Oracle"
moreLeanArgs = ["-DwarningAsError=true"]

[[lean_exe]]
name = "leanos-dma-corpus"
root = "LeanOS.DMAQuarantineCorpus"
moreLeanArgs = ["-DwarningAsError=true"]

[[lean_exe]]
name = "leanos-boot-plan"
root = "LeanOS.BootPageTablePlanGenerator"
moreLeanArgs = ["-DwarningAsError=true"]

[[lean_exe]]
name = "leanos-vtd-plan"
root = "LeanOS.VTdBootPlanGenerator"
moreLeanArgs = ["-DwarningAsError=true"]

[[lean_exe]]
name = "leanos-abi"
root = "LeanOS.BoundaryABIGenerator"
moreLeanArgs = ["-DwarningAsError=true"]

[[lean_exe]]
name = "leanos-copy-roots-replay"
root = "tests.CopyRootsReplay"
moreLeanArgs = ["-DwarningAsError=true"]

[[lean_exe]]
name = "leanos-copy-root-construction"
root = "tests.CopyRootConstruction"
moreLeanArgs = ["-DwarningAsError=true"]

[[lean_exe]]
name = "leanos-copy-operand-projection"
root = "tests.CopyOperandProjection"
moreLeanArgs = ["-DwarningAsError=true"]
