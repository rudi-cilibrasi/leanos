name: Release experimental image

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  LEANOS_CI_IMAGE_DIGEST: sha256:6d483272c53d05b10051fcf0f0f229788249acb0a27d76190d7dc683d8f962d5
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: ${{ github.workspace }}

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: Prove, reproduce, and collect release evidence
    runs-on: ubuntu-24.04
    container: ghcr.io/rudi-cilibrasi/leanos-ci@sha256:6d483272c53d05b10051fcf0f0f229788249acb0a27d76190d7dc683d8f962d5
    # The gate intentionally performs the proof suite, two clean
    # reproducibility builds, a final image build, and the full QEMU matrix.
    # A fresh hosted runner currently needs more than 20 minutes for that
    # bounded workload, so leave enough room for installation and packaging.
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate tag and set version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LEANOS_VERSION=$version" >> "$GITHUB_ENV"
          echo "LEANOS_SOURCE_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Lint repository documentation
        run: ./scripts/check-markdown.sh

      - name: Build and check every Lean proof
        run: ./scripts/check.sh

      - name: Verify deterministic image rebuild
        run: ./scripts/test-reproducible-build.sh

      - name: Run exact image build and QEMU smoke gates
        run: |
          ./scripts/build-image.sh
          ./scripts/record-tool-versions.sh
          ./scripts/run-emulator-evidence.py run

      - name: Package release evidence
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Preserve emulator diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leanos-tag-evidence-${{ github.sha }}
          path: |
            build/boot/*.serial.log
            build/boot/dma-quarantine-snapshot-*.tsv
            build/boot/*.iso
            build/boot/*.elf
            build/boot/*.map
            build/boot/*.disassembly.txt
            build/boot/fault-containment-snapshot.txt
            build/boot/fault-readonly-write-snapshot.txt
            build/boot/fault-nx-execute-snapshot.txt
            build/boot/fault-reserved-bit-terminal.txt
            build/boot/fault-walk-mismatch-terminal.txt
            build/boot/boot-page-plan*.h
            build/boot/SHA256SUMS
            build/boot/SOURCE_REVISION
            build/boot/corpus.tsv
            docs/page-fault-snapshot.md
            build/oracle/host-results.txt
            build/oracle-sanitized/host-results.txt
            build/boot-handoff-host/results.txt
            build/boot-handoff-host-sanitized/results.txt
            build/boot-handoff-stream/results.txt
            build/boot-handoff-stream-sanitized/results.txt
            build/hosted-sanitizer-evidence/*
            build/hosted-sanitizer-negatives/*
            scripts/hosted-generated-boundaries.tsv
            build/evidence/*
            build/ci/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Stage gated release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leanos-release-${{ github.sha }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Attest and publish gated evidence
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download gated release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: leanos-release-${{ github.sha }}
          path: build/release

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: build/release/*

      - name: Publish prerelease with ephemeral GitHub token
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" build/release/*
          --repo "$GITHUB_REPOSITORY"
          --title "LeanOS $GITHUB_REF_NAME (experimental)"
          --notes-file build/release/RELEASE_NOTES.md
          --prerelease
          --verify-tag
