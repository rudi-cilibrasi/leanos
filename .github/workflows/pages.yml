name: Deploy browser demo

# Builds the canonical ISO, stages the self-contained qemu-wasm demo from the
# hash-verified pinned runtime, boots the staged site in a browser as the
# acceptance gate, and deploys it to GitHub Pages. Deployment runs only on the
# default branch and manual dispatch, kept separate from pull-request
# validation (ADR 0011, issue #192). Enabling Pages with source "GitHub Actions"
# is a one-time repository setting.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  LEANOS_CI_IMAGE_DIGEST: sha256:6d483272c53d05b10051fcf0f0f229788249acb0a27d76190d7dc683d8f962d5
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: ${{ github.workspace }}

defaults:
  run:
    shell: bash

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Stage and verify the demo
    runs-on: ubuntu-24.04
    container: ghcr.io/rudi-cilibrasi/leanos-ci@sha256:6d483272c53d05b10051fcf0f0f229788249acb0a27d76190d7dc683d8f962d5
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Build canonical image
        run: ./scripts/build-image.sh

      - name: Prepare pinned browser runtime
        run: ./scripts/prepare-browser-runtime.sh

      - name: Install pinned browser
        id: browser
        run: |
          npx --yes @puppeteer/browsers install chrome@stable --path build/browser/chrome
          echo "path=$(find build/browser/chrome -type f -name chrome | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Browser boot acceptance
        env:
          LEANOS_BROWSER: ${{ steps.browser.outputs.path }}
        run: ./scripts/run-browser-boot.sh

      - name: Stage self-contained site
        run: ./scripts/stage-browser-demo.sh

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/browser/site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment_3.outputs.page_url }}
    steps:
      - name: Deploy (attempt 1 of 3)
        id: deployment_1
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Wait before deployment retry
        if: steps.deployment_1.outcome == 'failure'
        run: sleep 15

      - name: Deploy (attempt 2 of 3)
        id: deployment_2
        if: steps.deployment_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Wait before final deployment attempt
        if: steps.deployment_2.outcome == 'failure'
        run: sleep 30

      - name: Deploy (attempt 3 of 3)
        id: deployment_3
        if: steps.deployment_2.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
