name: Deploy browser demo

# Builds the canonical ISO, stages the self-contained qemu-wasm demo from the
# hash-verified pinned runtime, boots the staged site in a browser as the
# acceptance gate, and deploys it to GitHub Pages. Deployment runs only on the
# default branch and manual dispatch, kept separate from pull-request
# validation (ADR 0011, issue #192). Enabling Pages with source "GitHub Actions"
# is a one-time repository setting.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  LEANOS_CI_IMAGE_DIGEST: sha256:68e2dda17cfff2e94a60a4bfbbcb417d9e0a6ceb9a10f8fbb261bfbee59d48ec
  LEANOS_TOOLCHAIN_PROFILE: gcc-reference

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-image:
    name: Build revision-bound canonical image
    runs-on: ubuntu-24.04
    container: ghcr.io/rudi-cilibrasi/leanos-ci@sha256:68e2dda17cfff2e94a60a4bfbbcb417d9e0a6ceb9a10f8fbb261bfbee59d48ec
    # A canonical image build on a cold Lake cache takes 28 to 30 minutes on
    # the hosted runner, so retain the release-equivalent budget even though
    # the immutable cache below usually keeps it far shorter.
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Trust the container checkout for build steps
        # Checkout configures Git under a temporary HOME; subsequent container
        # steps need the mounted workspace trusted in their own Git config.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore immutable Lake build cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .lake
          key: lake-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LEANOS_CI_IMAGE_DIGEST }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'LeanOS.lean', 'LeanOS/**/*.lean') }}

      - name: Build and bundle the canonical image
        run: |
          LEANOS_BUILD_TIMING_FILE=build/ci/image-build-phases.tsv \
            ./scripts/build-image.sh
          pages_source=build/ci/pages-image-source
          mkdir -p "$pages_source/build/boot"
          image="leanos-$(cat VERSION)-x86_64.iso"
          for artifact in \
            "$image" \
            corpus.tsv \
            serial-protocol.sh \
            serial-protocol.tsv \
            SOURCE_REVISION \
            TOOLCHAIN_PROFILE.json; do
            test -s "build/boot/$artifact"
            cp "build/boot/$artifact" "$pages_source/build/boot/"
          done
          ./scripts/image-bundle.sh create \
            build/ci/leanos-pages-image.tar.gz "$pages_source"

      - name: Preserve image-build timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leanos-pages-build-timing-${{ github.sha }}
          path: build/ci/image-build-phases.tsv
          if-no-files-found: error
          retention-days: 14

      - name: Preserve revision-bound canonical image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leanos-pages-image-${{ github.sha }}
          path: |
            build/ci/leanos-pages-image.tar.gz
            build/ci/leanos-pages-image.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build:
    name: Stage and verify the demo
    needs: build-image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Download revision-bound canonical image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: leanos-pages-image-${{ github.sha }}
          path: build/ci/pages-image

      - name: Verify revision-bound canonical image
        run: |
          ./scripts/image-bundle.sh verify \
            build/ci/pages-image/leanos-pages-image.tar.gz \
            "${{ github.sha }}"
          test -s "build/boot/leanos-$(cat VERSION)-x86_64.iso"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Prepare pinned browser runtime
        run: ./scripts/prepare-browser-runtime.sh

      - name: Install pinned browser
        id: browser
        run: |
          npx --yes @puppeteer/browsers install chrome@stable --path build/browser/chrome
          echo "path=$(find build/browser/chrome -type f -name chrome | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Browser boot acceptance
        env:
          LEANOS_BROWSER: ${{ steps.browser.outputs.path }}
        run: ./scripts/run-browser-boot.sh

      - name: Stage self-contained site
        run: ./scripts/stage-browser-demo.sh

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/browser/site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment_3.outputs.page_url }}
    steps:
      - name: Deploy (attempt 1 of 3)
        id: deployment_1
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Wait before deployment retry
        if: steps.deployment_1.outcome == 'failure'
        run: sleep 15

      - name: Deploy (attempt 2 of 3)
        id: deployment_2
        if: steps.deployment_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Wait before final deployment attempt
        if: steps.deployment_2.outcome == 'failure'
        run: sleep 30

      - name: Deploy (attempt 3 of 3)
        id: deployment_3
        if: steps.deployment_2.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
