name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_serial_graph_parity:
        description: Build the selected serial base and current graph for byte parity
        required: false
        default: false
        type: boolean
      serial_base_ref:
        description: Git ref containing the legacy serial image wrapper
        required: false
        default: origin/main
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Lint Markdown
        run: ./scripts/check-markdown.sh

      - name: Test generated image object graph
        run: python3 scripts/test-generate-image-object-graph.py

  lean:
    name: Lean build and proof checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install pinned Lean toolchain
        uses: ./.github/actions/setup-lean

      - name: Install pinned hosted-boundary compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-13=13.3.0-6ubuntu2~24.04.1 \
            libasan8=14.2.0-4ubuntu2~24.04.1 \
            libubsan1=14.2.0-4ubuntu2~24.04.1 \
            binutils=2.42-4ubuntu2.10

      - name: Build and check proofs
        run: ./scripts/check.sh

      - name: Verify frame-budget negative evidence
        if: always()
        run: |
          manifest=build/boot/frame-budget-negatives/manifest.tsv
          test -s "$manifest"
          test "$(tail -n +2 "$manifest" | wc -l)" -eq 16
          while IFS=$'\t' read -r mode status failure_class serial_log output_log; do
            test "$status" -ne 0
            test "$failure_class" = serial-protocol
            test -s "build/boot/frame-budget-negatives/$serial_log"
            test -s "build/boot/frame-budget-negatives/$output_log"
          done < <(tail -n +2 "$manifest")

      - name: Preserve frame-budget negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frame-budget-negatives-${{ github.sha }}
          path: build/boot/frame-budget-negatives/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve generated-oracle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leanos-oracle-${{ github.sha }}
          path: |
            build/hosted-generated-sources/oracle/FrameBudgetScenario.c
            build/hosted-generated-sources/oracle/CompositeDispatcher.c
            include/leanos/composite-dispatcher.h
            build/oracle/corpus.tsv
            build/oracle/host-results.txt
            build/oracle/host-*.txt
            build/oracle/negative-fixtures.tsv
            build/oracle/toolchain-and-flags.tsv
            build/oracle/manifest.tsv
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve hosted sanitizer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-sanitizers-${{ github.sha }}
          path: |
            build/oracle-sanitized/
            build/boot-handoff-host-sanitized/
            build/boot-handoff-stream-sanitized/
            build/hosted-sanitizer-evidence/
            build/hosted-sanitizer-negatives/
            scripts/hosted-generated-boundaries.tsv
          if-no-files-found: warn
          retention-days: 14

  clang-image:
    name: Clang canonical image evidence
    needs: repository-hygiene
    runs-on: ubuntu-24.04
    # Clang 18 has now reached the complete image matrix but needs more than
    # 45 minutes to perform both reproducibility builds on hosted runners.
    timeout-minutes: 60
    env:
      LEANOS_CC: clang-18
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install pinned Lean toolchain
        uses: ./.github/actions/setup-lean

      - name: Install pinned Clang image and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18=1:18.1.3-1ubuntu1 \
            binutils=2.42-4ubuntu2.10 \
            grub-common=2.12-1ubuntu7.3 \
            grub-pc-bin=2.12-1ubuntu7.3 \
            mtools=4.0.43-1build1 \
            xorriso=1:1.5.6-1.1ubuntu3 \
            qemu-system-x86=1:8.2.2+ds-0ubuntu1.18 \
            coreutils=9.4-3ubuntu6.2

      - name: Verify selected compiler propagation
        run: ./scripts/test-selected-compiler-propagation.sh

      - name: Record independent-lane tool versions
        run: ./scripts/record-tool-versions.sh build/ci/clang-tool-versions.txt

      - name: Replay hosted generated boundaries with Clang
        env:
          LEANOS_HOST_CC: clang-18
        run: |
          lake build
          lake build leanos-boot-plan
          lake build leanos-vtd-plan
          ./scripts/check-hosted-generated-boundaries.sh ordinary

      - name: Reproduce and boot the canonical image with Clang
        run: |
          set -o pipefail
          mkdir -p build/ci
          ./scripts/test-reproducible-build.sh \
            2>&1 | tee build/ci/clang-image-build.log
          python3 scripts/run-emulator-evidence.py run \
            --scenario blocking-ipc \
            --tool-versions build/ci/clang-tool-versions.txt \
            --output build/evidence/clang-canonical.json \
            2>&1 | tee build/ci/clang-canonical-boot.log
          test -s build/boot/serial.log

      - name: Preserve Clang compiler and canonical boot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leanos-clang-canonical-${{ github.sha }}
          path: |
            build/boot/leanos-0.1.0-x86_64.iso
            build/boot/leanos-0.1.0-x86_64-assigned-edu.iso
            build/boot/leanos-assigned-edu.elf
            build/boot/leanos-assigned-edu.map
            build/boot/boot-page-plan-assigned-edu.h
            build/boot/boot-page-plan-assigned-edu.final.h
            build/boot/leanos.elf
            build/boot/leanos.map
            build/boot/SOURCE_REVISION
            build/boot/corpus.tsv
            build/boot/compiler-and-flags.tsv
            build/boot/entry-policy-report.txt
            build/boot/entry-stack-final-elf.txt
            build/boot/entry-stack-final-elf-edges.tsv
            build/boot/entry-stack-disassembly.txt
            build/boot/*.su
            build/boot/serial.log
            build/boot/dma-quarantine-snapshot-blocking-ipc.tsv
            build/boot/vtd-activation-snapshot-blocking-ipc.tsv
            build/evidence/clang-canonical.json
            build/evidence/blocking-ipc.command.log
            build/ci/clang-tool-versions.txt
            build/ci/clang-image-build.log
            build/ci/clang-canonical-boot.log
            build/oracle/
            build/boot-handoff-host/
            build/boot-topology-host/
            build/boot-handoff-stream/
            scripts/hosted-generated-boundaries.tsv
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: Deterministic QEMU smoke test (shard ${{ matrix.shard }})
    needs: repository-hygiene
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # The complete boot-critical matrix can take about 40 minutes including
    # evidence upload and runner cleanup; retain a bounded variance margin.
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install pinned Lean toolchain
        uses: ./.github/actions/setup-lean

      - name: Install image and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc=4:13.2.0-7ubuntu1 \
            binutils=2.42-4ubuntu2.10 \
            grub-common=2.12-1ubuntu7.3 \
            grub-pc-bin=2.12-1ubuntu7.3 \
            mtools=4.0.43-1build1 \
            xorriso=1:1.5.6-1.1ubuntu3 \
            qemu-system-x86=1:8.2.2+ds-0ubuntu1.18 \
            coreutils=9.4-3ubuntu6.2

      - name: Record tool versions
        run: ./scripts/record-tool-versions.sh

      - name: Check q35 PCI construction inventory
        run: |
          ./scripts/check-q35-pci-construction.py \
            --output build/evidence/q35-pci-construction.tsv
          ./scripts/check-q35-edu-dma.py \
            --output build/evidence/q35-edu-dma.tsv

      - name: Verify image-build failures propagate
        run: ./scripts/test-build-image.sh

      - name: Build and boot image
        run: |
          set -o pipefail
          mkdir -p build/ci
          ./scripts/build-image.sh 2>&1 | tee build/ci/image-build.log
          ./scripts/test-nmi-image-policy.sh
          ./scripts/test-early-idt-policy.sh
          ./scripts/test-early-probe-policy.sh
          ./scripts/run-dma-unknown-device.sh
          ./scripts/run-emulator-evidence.py run \
            --shard-index ${{ matrix.shard }} \
            --shard-count 4 \
            --output build/evidence/emulator-shard-${{ matrix.shard }}.json \
            2>&1 | tee build/ci/emulator-evidence.log
          ./scripts/run-assigned-edu-negatives.sh \
            2>&1 | tee build/ci/assigned-edu-negatives.log

      - name: Preserve reproducibility artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leanos-boot-${{ github.sha }}-shard-${{ matrix.shard }}
