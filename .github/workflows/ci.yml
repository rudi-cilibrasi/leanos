name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  # Retain queue compatibility if the repository moves to an organization.
  merge_group:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_serial_graph_parity:
        description: Build the selected serial base and current graph for byte parity
        required: false
        default: false
        type: boolean
      serial_base_ref:
        description: Git ref containing the legacy serial image wrapper
        required: false
        default: origin/main
        type: string

permissions:
  contents: read

env:
  LEANOS_CI_IMAGE_DIGEST: sha256:68e2dda17cfff2e94a60a4bfbbcb417d9e0a6ceb9a10f8fbb261bfbee59d48ec
  LEANOS_TOOLCHAIN_PROFILE: gcc-reference
  # Personal-account repositories cannot enable GitHub's merge queue. A
  # maintainer promotes a ready PR to the full tier with this reviewed label.
  LEANOS_CI_EVIDENCE_TIER: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full-admission')) && 'all' || 'pr' }}
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: ${{ github.workspace }}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    container: ghcr.io/rudi-cilibrasi/leanos-ci@sha256:68e2dda17cfff2e94a60a4bfbbcb417d9e0a6ceb9a10f8fbb261bfbee59d48ec
    # The lint step fetches markdownlint-cli2 through npx; a slow registry has
    # exceeded the previous 5-minute budget in roughly a fifth of runs (a cold
    # fetch has taken 7 minutes), so the npm cache is kept across runs and the
    # budget leaves room for a cold one.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Restore the npm cache for markdownlint
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v4
        with:
          path: ~/.npm
          key: npm-markdownlint-cli2-0.23.0

      - name: Lint Markdown
        run: ./scripts/check-markdown.sh

      - name: Test generated image object graph
        run: python3 scripts/test-generate-image-object-graph.py

      - name: Test reproducibility manifest contract
        run: ./scripts/test-reproducibility-manifest.sh

      - name: Test main admission policy contract
        run: python3 scripts/test-main-ruleset-policy.py

      - name: Test toolchain profile contract
        run: python3 scripts/test-toolchain-profile.py

      - name: Test image-build timing evidence contract
        run: python3 scripts/test-build-timing.py

      - name: Test aggregate-check timing evidence contract
        run: python3 scripts/test-check-timing.py

  lean:
    name: Lean build and proof checks
    runs-on: ubuntu-24.04
    container: ghcr.io/rudi-cilibrasi/leanos-ci@sha256:68e2dda17cfff2e94a60a4bfbbcb417d9e0a6ceb9a10f8fbb261bfbee59d48ec
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Restore immutable Lake build cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .lake
          key: lake-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LEANOS_CI_IMAGE_DIGEST }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'LeanOS.lean', 'LeanOS/**/*.lean') }}

      - name: Build and check proofs
        env:
          # Pull requests and merge groups run the same hosted evidence in the
          # parallel job below. Main-push and manual runs retain the replay here.
          LEANOS_SKIP_HOSTED_BOUNDARY_REPLAY: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '1' || '0' }}
        run: ./scripts/check.sh

      - name: Verify frame-budget negative evidence
        if: always()
        run: ./scripts/verify-negative-evidence.sh frame-budget

      - name: Preserve frame-budget negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frame-budget-negatives-${{ github.sha }}
          path: build/boot/frame-budget-negatives/
          if-no-files-found: error
          retention-days: 14

      - name: Verify capability-transfer negative evidence
        if: always()
        run: ./scripts/verify-negative-evidence.sh capability-transfer

      - name: Preserve capability-transfer negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capability-transfer-negatives-${{ github.sha }}
          path: build/boot/capability-transfer-negatives/
          if-no-files-found: error
          retention-days: 14

      - name: Verify in-flight revocation negative evidence
        if: always()
        run: ./scripts/verify-negative-evidence.sh inflight-revocation

      - name: Preserve in-flight revocation negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inflight-revocation-negatives-${{ github.sha }}
          path: build/boot/inflight-revocation-negatives/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve generated-oracle evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leanos-oracle-${{ github.sha }}
          path: |
            build/hosted-generated-sources/oracle/FrameBudgetScenario.c
            build/hosted-generated-sources/oracle/CompositeDispatcher.c
            include/leanos/composite-dispatcher.h
            build/oracle/corpus.tsv
            build/oracle/vocabulary.tsv
            build/oracle/composite-tokens.h
            build/oracle/boundary-abi.tsv
            build/oracle/boundary-abi.h
            build/oracle/serial-protocol.tsv
            build/oracle/serial-protocol.h
            build/oracle/serial-protocol.sh
            build/oracle/host-results.txt
            build/oracle/host-*.txt
            build/oracle/negative-fixtures.tsv
            build/oracle/toolchain-and-flags.tsv
            build/oracle/manifest.tsv
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve hosted sanitizer evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-sanitizers-${{ github.sha }}
          path: |
            build/oracle-sanitized/
            build/boot-handoff-host-sanitized/
            build/boot-handoff-stream-sanitized/
            build/hosted-sanitizer-evidence/
            build/hosted-sanitizer-negatives/
            scripts/hosted-generated-boundaries.tsv
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve aggregate-check timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aggregate-check-timing-${{ github.sha }}
          path: build/ci/check-*.tsv
          if-no-files-found: warn
          retention-days: 14

  hosted-boundary:
    name: Hosted generated-boundary evidence
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    container: ghcr.io/rudi-cilibrasi/leanos-ci@sha256:68e2dda17cfff2e94a60a4bfbbcb417d9e0a6ceb9a10f8fbb261bfbee59d48ec
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Restore immutable Lake build cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .lake
          key: lake-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LEANOS_CI_IMAGE_DIGEST }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'LeanOS.lean', 'LeanOS/**/*.lean') }}

      - name: Replay hosted generated boundaries
        run: |
          lake build
          lake build leanos-boot-plan
          lake build leanos-vtd-plan
          ./scripts/test-hosted-boundary-harness-scan.sh
          ./scripts/check-hosted-generated-boundaries.sh ordinary
          ./scripts/check-hosted-generated-boundaries.sh sanitized
          ./scripts/check-hosted-sanitizer-negatives.sh

      - name: Preserve generated-oracle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leanos-oracle-${{ github.sha }}
          path: |
            build/hosted-generated-sources/oracle/FrameBudgetScenario.c
            build/hosted-generated-sources/oracle/CompositeDispatcher.c
            include/leanos/composite-dispatcher.h
            build/oracle/corpus.tsv
            build/oracle/vocabulary.tsv
            build/oracle/composite-tokens.h
            build/oracle/boundary-abi.tsv
            build/oracle/boundary-abi.h
            build/oracle/serial-protocol.tsv
            build/oracle/serial-protocol.h
            build/oracle/serial-protocol.sh
            build/oracle/host-results.txt
            build/oracle/host-*.txt
            build/oracle/negative-fixtures.tsv
            build/oracle/toolchain-and-flags.tsv
            build/oracle/manifest.tsv
          if-no-files-found: error
          retention-days: 14

      - name: Preserve hosted sanitizer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-sanitizers-${{ github.sha }}
          path: |
            build/oracle-sanitized/
            build/boot-handoff-host-sanitized/
            build/boot-handoff-stream-sanitized/
            build/hosted-sanitizer-evidence/
            build/hosted-sanitizer-negatives/
            scripts/hosted-generated-boundaries.tsv
          if-no-files-found: error
          retention-days: 14

  clang-image:
    name: Clang canonical image evidence
    needs: repository-hygiene
    runs-on: ubuntu-24.04
    container: ghcr.io/rudi-cilibrasi/leanos-ci@sha256:68e2dda17cfff2e94a60a4bfbbcb417d9e0a6ceb9a10f8fbb261bfbee59d48ec
    # The independent reproducibility build runs in parallel below; this lane
    # retains the canonical boot and full evidence bundle.
    timeout-minutes: 60
    env:
      LEANOS_CC: clang-18
      LEANOS_TOOLCHAIN_PROFILE: clang-reference
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Restore immutable Lake build cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .lake
          key: lake-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LEANOS_CI_IMAGE_DIGEST }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'LeanOS.lean', 'LeanOS/**/*.lean') }}

      - name: Verify selected compiler propagation
        run: ./scripts/test-selected-compiler-propagation.sh

      - name: Record independent-lane tool versions
        run: ./scripts/record-tool-versions.sh build/ci/clang-tool-versions.txt

      - name: Replay hosted generated boundaries with Clang
        env:
          LEANOS_HOST_CC: clang-18
        run: |
          lake build
          lake build leanos-boot-plan
          lake build leanos-vtd-plan
          ./scripts/check-hosted-generated-boundaries.sh ordinary

      - name: Build and boot the canonical image with Clang
        run: |
          set -o pipefail
          mkdir -p build/ci
          LEANOS_BUILD_TIMING_FILE=build/ci/clang-image-build-phases.tsv \
            LEANOS_EVIDENCE_TIER="${{ env.LEANOS_CI_EVIDENCE_TIER }}" \
            LEANOS_EVIDENCE_SHARD_INDEX="${{ env.LEANOS_CI_EVIDENCE_TIER == 'pr' && '0' || '' }}" \
            LEANOS_EVIDENCE_SHARD_COUNT="${{ env.LEANOS_CI_EVIDENCE_TIER == 'pr' && '4' || '' }}" \
            ./scripts/build-image.sh \
            2>&1 | tee build/ci/clang-image-build.log
          if [[ "${{ env.LEANOS_CI_EVIDENCE_TIER }}" == all ]]; then
            ./scripts/write-reproducibility-manifest.sh
          fi
          python3 scripts/run-emulator-evidence.py run \
            --scenario blocking-ipc \
            --tool-versions build/ci/clang-tool-versions.txt \
            --output build/evidence/clang-canonical.json \
            2>&1 | tee build/ci/clang-canonical-boot.log
          test -s build/boot/serial.log

      - name: Preserve Clang compiler and canonical boot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leanos-clang-canonical-${{ github.sha }}
          path: |
            build/boot/leanos-0.1.0-x86_64.iso
            build/boot/leanos-0.1.0-x86_64-assigned-edu.iso
            build/boot/leanos-assigned-edu.elf
            build/boot/leanos-assigned-edu.map
            build/boot/boot-page-plan-assigned-edu.h
            build/boot/boot-page-plan-assigned-edu.final.h
            build/boot/leanos.elf
            build/boot/leanos.map
            build/boot/SOURCE_REVISION
            build/boot/TOOLCHAIN_PROFILE.json
            build/boot/corpus.tsv
            build/boot/compiler-and-flags.tsv
            build/boot/entry-policy-report.txt
            build/boot/entry-stack-final-elf.txt
            build/boot/entry-stack-final-elf-edges.tsv
            build/boot/entry-stack-disassembly.txt
            build/boot/*.su
            build/boot/serial.log
            build/boot/dma-quarantine-snapshot-blocking-ipc.tsv
            build/boot/vtd-activation-snapshot-blocking-ipc.tsv
            build/evidence/clang-canonical.json
            build/evidence/blocking-ipc.command.log
            build/ci/clang-tool-versions.txt
            build/ci/clang-image-build.log
            build/ci/clang-image-build-phases.tsv
            build/ci/clang-canonical-boot.log
            build/oracle/
            build/boot-handoff-host/
            build/boot-topology-host/
            build/boot-handoff-stream/
            scripts/hosted-generated-boundaries.tsv
          if-no-files-found: error
          retention-days: 14

      - name: Preserve primary reproducibility manifest
        if: env.LEANOS_CI_EVIDENCE_TIER == 'all'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leanos-clang-repro-primary-${{ github.sha }}
          path: build/boot/REPRODUCIBILITY-SHA256SUMS
          if-no-files-found: error
          retention-days: 14


  gcc-image-family:
    name: GCC canonical image-family bundle
    needs: repository-hygiene
    runs-on: ubuntu-24.04
    container: ghcr.io/rudi-cilibrasi/leanos-ci@sha256:68e2dda17cfff2e94a60a4bfbbcb417d9e0a6ceb9a10f8fbb261bfbee59d48ec
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Restore immutable Lake build cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .lake
          key: lake-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LEANOS_CI_IMAGE_DIGEST }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'LeanOS.lean', 'LeanOS/**/*.lean') }}

      - name: Build canonical GCC image family
        if: env.LEANOS_CI_EVIDENCE_TIER == 'all'
        run: |
          LEANOS_BUILD_TIMING_FILE=build/ci/gcc-image-build-phases.tsv \
            LEANOS_EVIDENCE_TIER=all ./scripts/build-image.sh
          ./scripts/image-bundle.sh create \
            build/ci/leanos-image-bundle.tar.gz

      - name: Preserve verified image-family bundle
        if: env.LEANOS_CI_EVIDENCE_TIER == 'all'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leanos-image-family-${{ github.sha }}
          path: |
            build/ci/leanos-image-bundle.tar.gz
            build/ci/leanos-image-bundle.tar.gz.sha256
            build/ci/gcc-image-build-phases.tsv
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  reproducibility-plan:
    name: Reproducibility partition plan
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full-admission')
    needs: repository-hygiene
    runs-on: ubuntu-24.04
    container: ghcr.io/rudi-cilibrasi/leanos-ci@sha256:68e2dda17cfff2e94a60a4bfbbcb417d9e0a6ceb9a10f8fbb261bfbee59d48ec
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Generate immutable partition plan
        run: |
          mkdir -p build/reproducibility
          ./scripts/write-reproducibility-manifest.sh --list \
            > build/reproducibility/artifacts.txt
          python3 scripts/reproducibility-partitions.py plan \
            build/reproducibility/artifacts.txt \
            --partitions 4 \
            --source-revision "${{ github.sha }}" \
            --toolchain-id "clang-reference@${LEANOS_CI_IMAGE_DIGEST}" \
            > build/reproducibility/plan.json

      - name: Preserve partition plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leanos-reproducibility-plan-${{ github.sha }}
          path: build/reproducibility/plan.json
          if-no-files-found: error
          retention-days: 14

  clang-reproducibility-build:
    name: Clang independent reproducibility build
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full-admission')
    needs: repository-hygiene
    runs-on: ubuntu-24.04
    container: ghcr.io/rudi-cilibrasi/leanos-ci@sha256:68e2dda17cfff2e94a60a4bfbbcb417d9e0a6ceb9a10f8fbb261bfbee59d48ec
    timeout-minutes: 60
    env:
      LEANOS_CC: clang-18
      LEANOS_TOOLCHAIN_PROFILE: clang-reference
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Build independent image and manifest
        run: |
          LEANOS_BUILD_TIMING_FILE=build/boot/clang-repro-build-phases.tsv \
            ./scripts/build-image.sh
          ./scripts/write-reproducibility-manifest.sh

      - name: Publish independent build phase summary
        run: |
          python3 scripts/check-build-timing.py \
            build/boot/clang-repro-build-phases.tsv --format github \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve independent reproducibility manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leanos-clang-repro-independent-${{ github.sha }}
          path: |
            build/boot/REPRODUCIBILITY-SHA256SUMS
            build/boot/clang-repro-build-phases.tsv
          if-no-files-found: error
          retention-days: 14

  clang-reproducibility:
    name: Clang cross-runner reproducibility
    needs: [clang-image, clang-reproducibility-build]
    runs-on: ubuntu-24.04
    container: ghcr.io/rudi-cilibrasi/leanos-ci@sha256:68e2dda17cfff2e94a60a4bfbbcb417d9e0a6ceb9a10f8fbb261bfbee59d48ec
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Download primary reproducibility manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: leanos-clang-repro-primary-${{ github.sha }}
          path: build/reproducibility/primary

      - name: Download independent reproducibility manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: leanos-clang-repro-independent-${{ github.sha }}
          path: build/reproducibility/independent

      - name: Compare cross-runner manifests
        run: |
          ./scripts/compare-reproducibility-manifests.sh \
            build/reproducibility/primary/REPRODUCIBILITY-SHA256SUMS \
            build/reproducibility/independent/REPRODUCIBILITY-SHA256SUMS

  emulator:
    name: Deterministic QEMU smoke test (shard ${{ matrix.shard }})
    needs: [repository-hygiene, gcc-image-family]
    runs-on: ubuntu-24.04
    container: ghcr.io/rudi-cilibrasi/leanos-ci@sha256:68e2dda17cfff2e94a60a4bfbbcb417d9e0a6ceb9a10f8fbb261bfbee59d48ec
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # The complete boot-critical matrix can take about 40 minutes including
    # evidence upload and runner cleanup; retain a bounded variance margin.
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Restore immutable Lake build cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .lake
          key: lake-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LEANOS_CI_IMAGE_DIGEST }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'LeanOS.lean', 'LeanOS/**/*.lean') }}

      - name: Record tool versions
        run: ./scripts/record-tool-versions.sh

      - name: Check q35 PCI construction inventory
        run: |
          ./scripts/check-q35-pci-construction.py \
            --output build/evidence/q35-pci-construction.tsv
          ./scripts/check-q35-edu-dma.py \
            --output build/evidence/q35-edu-dma.tsv

      - name: Download canonical image family
        if: env.LEANOS_CI_EVIDENCE_TIER == 'all'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: leanos-image-family-${{ github.sha }}
          path: build/ci/image-family

      - name: Build and boot image
        run: |
          set -o pipefail
          mkdir -p build/ci
          if [[ "${{ env.LEANOS_CI_EVIDENCE_TIER }}" == all ]]; then
            ./scripts/image-bundle.sh verify \
              build/ci/image-family/leanos-image-bundle.tar.gz \
              "${{ github.sha }}"
            cp build/ci/image-family/gcc-image-build-phases.tsv build/ci/image-build-phases.tsv
            printf 'verified canonical image-family bundle for %s\n' \
              "${{ github.sha }}" > build/ci/image-build.log
          else
            LEANOS_BUILD_TIMING_FILE=build/ci/image-build-phases.tsv \
              LEANOS_EVIDENCE_TIER="${{ env.LEANOS_CI_EVIDENCE_TIER }}" \
              LEANOS_EVIDENCE_SHARD_INDEX="${{ matrix.shard }}" \
              LEANOS_EVIDENCE_SHARD_COUNT=4 \
              ./scripts/build-image.sh 2>&1 | tee build/ci/image-build.log
          fi
          [[ ! -f build/boot/leanos-nmi.elf ]] || \
            ./scripts/test-nmi-image-policy.sh
          [[ ! -f build/boot/leanos.elf ]] || \
            ./scripts/test-early-idt-policy.sh
          [[ ! -f build/boot/kernel.o ]] || \
            ./scripts/test-early-probe-policy.sh
          [[ ! -f build/boot/leanos-${LEANOS_VERSION:-0.1.0}-x86_64.iso ]] || \
            ./scripts/run-dma-unknown-device.sh
          ./scripts/run-emulator-evidence.py run \
            --tier "${{ env.LEANOS_CI_EVIDENCE_TIER }}" \
            --shard-index ${{ matrix.shard }} \
            --shard-count 4 \
            --output build/evidence/emulator-shard-${{ matrix.shard }}.json \
            2>&1 | tee build/ci/emulator-evidence.log
          if [[ -f build/boot/leanos-${LEANOS_VERSION:-0.1.0}-x86_64-assigned-edu-missing-mmio-mapping.iso ]]; then
            ./scripts/run-assigned-edu-negatives.sh \
              2>&1 | tee build/ci/assigned-edu-negatives.log
          fi

      - name: Bundle reproducibility artifacts
        if: always()
        run: |
          ./scripts/run-emulator-evidence.py bundle \
            build/evidence/emulator-shard-${{ matrix.shard }}.json \
            --output build/ci/emulator-evidence-shard-${{ matrix.shard }}.tar

      - name: Preserve reproducibility artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leanos-boot-${{ github.sha }}-shard-${{ matrix.shard }}
          path: build/ci/emulator-evidence-shard-${{ matrix.shard }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  kvm-evidence:
    name: KVM-on-host evidence (shard ${{ matrix.shard }}, non-blocking)
    needs: repository-hygiene
    runs-on: ubuntu-24.04
    # GitHub documents Linux hardware acceleration but does not support nested
    # virtualization as a stable service contract. Keep runner-side outages
    # visible without making this initial observation lane a merge gate.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Probe explicit KVM availability
        id: kvm-probe
        run: |
          set -o pipefail
          mkdir -p build/evidence
          image="ghcr.io/rudi-cilibrasi/leanos-ci@${LEANOS_CI_IMAGE_DIGEST}"
          report="build/evidence/kvm-preflight-shard-${{ matrix.shard }}.json"
          docker pull "$image"
          device_args=()
          [[ ! -c /dev/kvm ]] || device_args=(--device /dev/kvm)
          set +e
          docker run --rm "${device_args[@]}" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env GITHUB_SHA --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env RUNNER_OS --env RUNNER_ARCH --env ImageOS --env ImageVersion \
            "$image" \
            python3 scripts/probe-kvm.py --output "$report"
          probe_status=$?
          set -e
          if [[ "$probe_status" -eq 125 ]]; then
            docker run --rm \
              --volume "$GITHUB_WORKSPACE:/workspace" \
              --workdir /workspace \
              --env GITHUB_SHA --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
              --env RUNNER_OS --env RUNNER_ARCH --env ImageOS --env ImageVersion \
              "$image" \
              python3 scripts/probe-kvm.py --output "$report" \
                --classify-unavailable docker-device-mapping-failed || \
              test "$?" -eq 20
            probe_status=20
          fi
          [[ "$probe_status" -eq 0 || "$probe_status" -eq 20 ]]
          mapfile -t classification < <(
            python3 - "$report" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          print(report["status"])
          print(report["reason"])
          PY
          )
          status="${classification[0]}"
          reason="${classification[1]}"
          [[ "$status" != available ]] || test "$probe_status" -eq 0
          [[ "$status" != unavailable ]] || test "$probe_status" -eq 20
          echo "available=$([[ "$status" == available ]] && echo true || echo false)" \
            >> "$GITHUB_OUTPUT"
          {
            echo "### KVM evidence shard ${{ matrix.shard }}: $status"
            echo
            echo "Classification: $reason"
            echo
            echo "An unavailable classification is not a passing KVM run."
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$status" == available ]] || exit 20

      - name: Build and run the PR-tier shard with KVM
        if: steps.kvm-probe.outputs.available == 'true'
        run: |
          set -o pipefail
          image="ghcr.io/rudi-cilibrasi/leanos-ci@${LEANOS_CI_IMAGE_DIGEST}"
          docker run --rm --device /dev/kvm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env GITHUB_SHA --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env RUNNER_OS --env RUNNER_ARCH --env ImageOS --env ImageVersion \
            --env LEANOS_CI_IMAGE_DIGEST \
            --env LEANOS_TOOLCHAIN_PROFILE \
            --env LEANOS_QEMU_ACCELERATOR=kvm \
            "$image" bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /workspace
              mkdir -p build/ci
              ./scripts/record-tool-versions.sh build/ci/tool-versions.txt
              ./scripts/check-q35-pci-construction.py \
                --output build/evidence/q35-pci-construction.tsv
              ./scripts/check-q35-edu-dma.py \
                --output build/evidence/q35-edu-dma.tsv
              LEANOS_EVIDENCE_TIER=pr \
                LEANOS_EVIDENCE_SHARD_INDEX=${{ matrix.shard }} \
                LEANOS_EVIDENCE_SHARD_COUNT=4 \
                LEANOS_BUILD_TIMING_FILE=build/ci/image-build-phases.tsv \
                ./scripts/build-image.sh \
                2>&1 | tee build/ci/image-build.log
              ./scripts/run-emulator-evidence.py run \
                --tier pr \
                --shard-index ${{ matrix.shard }} \
                --shard-count 4 \
                --tool-versions build/ci/tool-versions.txt \
                --output build/evidence/kvm-emulator-shard-${{ matrix.shard }}.json \
                2>&1 | tee build/ci/emulator-evidence.log
            '

      - name: Bundle KVM evidence
        if: always() && steps.kvm-probe.outputs.available == 'true'
        run: |
          image="ghcr.io/rudi-cilibrasi/leanos-ci@${LEANOS_CI_IMAGE_DIGEST}"
          report="build/evidence/kvm-emulator-shard-${{ matrix.shard }}.json"
          bundle="build/ci/kvm-evidence-shard-${{ matrix.shard }}.tar"
          test -s "$report"
          set +e
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$image" python3 scripts/run-emulator-evidence.py bundle "$report" \
              --output "$bundle"
          bundle_status=$?
          set -e
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$image" chmod a+r "$bundle"
          test -s "$bundle"
          report_status="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["status"])' \
            "$report")"
          if [[ "$report_status" == PASS ]]; then
            test "$bundle_status" -eq 0
          else
            test "$bundle_status" -ne 0
          fi

      - name: Preserve KVM classification and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leanos-kvm-${{ github.sha }}-shard-${{ matrix.shard }}
          path: |
            build/evidence/kvm-preflight-shard-${{ matrix.shard }}.json
            build/evidence/kvm-emulator-shard-${{ matrix.shard }}.json
            build/ci/kvm-evidence-shard-${{ matrix.shard }}.tar
            build/ci/image-build.log
            build/ci/image-build-phases.tsv
            build/ci/emulator-evidence.log
            build/ci/tool-versions.txt
            build/evidence/*.command.log
            build/evidence/q35-*.tsv
            build/boot/*.serial.log
            build/boot/*.qmp.jsonl
            build/boot/*.qmp.tsv
          if-no-files-found: error
          retention-days: 14

  premerge-admission:
    name: Pre-merge full admission
    if: always() && github.event_name == 'pull_request'
    needs:
      - repository-hygiene
      - lean
      - hosted-boundary
      - clang-image
      - gcc-image-family
      - reproducibility-plan
      - clang-reproducibility-build
      - clang-reproducibility
      - emulator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require promoted full evidence
        env:
          PROMOTED: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full-admission') }}
          REPOSITORY_HYGIENE: ${{ needs.repository-hygiene.result }}
          LEAN: ${{ needs.lean.result }}
          HOSTED_BOUNDARY: ${{ needs.hosted-boundary.result }}
          CLANG_IMAGE: ${{ needs.clang-image.result }}
          GCC_IMAGE_FAMILY: ${{ needs.gcc-image-family.result }}
          REPRODUCIBILITY_PLAN: ${{ needs.reproducibility-plan.result }}
          CLANG_REPRO_BUILD: ${{ needs.clang-reproducibility-build.result }}
          CLANG_REPRO_COMPARE: ${{ needs.clang-reproducibility.result }}
          EMULATOR: ${{ needs.emulator.result }}
        run: |
          if [[ "$PROMOTED" != true ]]; then
            echo "error: a maintainer must apply ci:full-admission before merge" >&2
            exit 1
          fi
          for result in \
            "$REPOSITORY_HYGIENE" "$LEAN" "$HOSTED_BOUNDARY" \
            "$CLANG_IMAGE" "$GCC_IMAGE_FAMILY" "$REPRODUCIBILITY_PLAN" \
            "$CLANG_REPRO_BUILD" \
            "$CLANG_REPRO_COMPARE" "$EMULATOR"; do
            if [[ "$result" != success ]]; then
              echo "error: promoted full-evidence dependency concluded $result" >&2
              exit 1
            fi
          done
          echo "Promoted pull request passed complete pre-merge evidence"

  serial-graph-parity:
    name: Serial vs graph image parity
    if: github.event_name == 'workflow_dispatch' && inputs.run_serial_graph_parity
    runs-on: ubuntu-24.04
    container: ghcr.io/rudi-cilibrasi/leanos-ci@sha256:68e2dda17cfff2e94a60a4bfbbcb417d9e0a6ceb9a10f8fbb261bfbee59d48ec
    timeout-minutes: 60
    env:
      LEANOS_CC: clang-18
      LEANOS_TOOLCHAIN_PROFILE: clang-reference
      SERIAL_BASE_REF: ${{ inputs.serial_base_ref }}
    steps:
      - name: Check out graph head and serial base history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Build serial baseline and graph head in the same workspace
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          base_sha="$(git rev-parse --verify "${SERIAL_BASE_REF}^{commit}")"
          baseline_dir="$(mktemp -d "${RUNNER_TEMP}/leanos-serial.XXXXXX")"
          summary="${RUNNER_TEMP}/image-parity-summary.txt"

          git checkout --detach "$base_sha"
          serial_start="$SECONDS"
          LEANOS_BUILD_TIMING_FILE="${RUNNER_TEMP}/serial-build-phases.tsv" \
            LEANOS_SOURCE_REVISION="$head_sha" ./scripts/build-image.sh
          serial_seconds="$((SECONDS - serial_start))"
          mv build/boot "$baseline_dir/boot"
          rm -rf build

          git checkout --detach "$head_sha"
          graph_start="$SECONDS"
          LEANOS_BUILD_TIMING_FILE="${RUNNER_TEMP}/graph-build-phases.tsv" \
            LEANOS_SOURCE_REVISION="$head_sha" ./scripts/build-image.sh
          graph_seconds="$((SECONDS - graph_start))"

          {
            echo "head_sha=$head_sha"
            echo "serial_base_sha=$base_sha"
            echo "serial_seconds=$serial_seconds"
            echo "graph_seconds=$graph_seconds"
          } | tee "$summary"

          # The graph deliberately compiles combined Lean modules as
          # independent .part objects. Intermediate objects, dependency files,
          # and GCC stack-usage sidecars therefore have a different partition
          # than the serial compiler. Compare the generated sources and final
          # deliverable/evidence artifacts, whose bytes must remain identical.
          find "$baseline_dir/boot" -type f \
            ! -name '*.o' \
            ! -name '*.d' \
            ! -name '*.su' \
            ! -name '*.inputs.sha256' \
            ! -name '*.serial.log' \
            ! -name 'serial.log' \
            ! -name 'SHA256SUMS' \
            ! -path '*/iso-*/*' \
            -printf '%P\0' | sort -z > "${RUNNER_TEMP}/serial-artifacts.list"

          artifact_count=0
          mismatch_report="${RUNNER_TEMP}/serial-graph-mismatches.txt"
          first_mismatch_dir="${RUNNER_TEMP}/serial-graph-first-mismatch"
          : > "$mismatch_report"
          while IFS= read -r -d '' artifact; do
            artifact_count="$((artifact_count + 1))"
            test -f "build/boot/$artifact" || {
              echo "missing graph artifact: $artifact" | \
                tee -a "$mismatch_report" >&2
              continue
            }
            cmp -s "$baseline_dir/boot/$artifact" "build/boot/$artifact" || {
              {
                echo "serial/graph byte mismatch: $artifact"
                sha256sum \
                  "$baseline_dir/boot/$artifact" "build/boot/$artifact"
              } | tee -a "$mismatch_report" >&2
              if [[ ! -d "$first_mismatch_dir" ]]; then
                mkdir -p "$first_mismatch_dir"
                cp "$baseline_dir/boot/$artifact" \
                  "$first_mismatch_dir/serial-artifact"
                cp "build/boot/$artifact" \
                  "$first_mismatch_dir/graph-artifact"
                {
                  echo "artifact=$artifact"
                  file "$first_mismatch_dir/serial-artifact" \
                    "$first_mismatch_dir/graph-artifact"
                  wc -c "$first_mismatch_dir/serial-artifact" \
                    "$first_mismatch_dir/graph-artifact"
                  echo "first differing bytes (offset serial graph):"
                  cmp -l "$first_mismatch_dir/serial-artifact" \
                    "$first_mismatch_dir/graph-artifact" | head -n 256 || true
                } > "$first_mismatch_dir/diagnostic.txt"
              fi
            }
          done < "${RUNNER_TEMP}/serial-artifacts.list"

          echo "compared_artifacts=$artifact_count" | tee -a "$summary"

          cp "$baseline_dir/boot/SHA256SUMS" \
            "${RUNNER_TEMP}/serial-SHA256SUMS"
          cp build/boot/SHA256SUMS "${RUNNER_TEMP}/graph-SHA256SUMS"
          if ! cmp -s "${RUNNER_TEMP}/serial-SHA256SUMS" \
            "${RUNNER_TEMP}/graph-SHA256SUMS"; then
            echo "serial/graph byte mismatch: SHA256SUMS" | \
              tee -a "$mismatch_report" >&2
            diff -u "${RUNNER_TEMP}/serial-SHA256SUMS" \
              "${RUNNER_TEMP}/graph-SHA256SUMS" | \
              tee -a "$mismatch_report" >&2 || true
          fi
          test ! -s "$mismatch_report" || exit 1

          if ((graph_seconds > 360)); then
            echo "graph clean build exceeded the 360-second acceptance target" >&2
            exit 1
          fi

      - name: Preserve parity and timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: serial-graph-parity-${{ github.sha }}
          path: |
            ${{ runner.temp }}/image-parity-summary.txt
            ${{ runner.temp }}/serial-artifacts.list
            ${{ runner.temp }}/serial-graph-mismatches.txt
            ${{ runner.temp }}/serial-SHA256SUMS
            ${{ runner.temp }}/graph-SHA256SUMS
            ${{ runner.temp }}/serial-build-phases.tsv
            ${{ runner.temp }}/graph-build-phases.tsv
            ${{ runner.temp }}/serial-graph-first-mismatch
          if-no-files-found: warn
          retention-days: 14
