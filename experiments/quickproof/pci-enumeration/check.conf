# qp check settings for scripts/check-quickproof.sh (parsed, not sourced).
# A run that scans the whole segment makes 65536 + up to 240 reads through the
# law's checking device in the CompCert interpreter: at the default 10 s, 6 of
# 10 seeds timed out, and at 120 s on a loaded machine (load average 12 on 12
# CPUs), 1 of 10 did. Each seed gets 600 s.
GP_INTERP_TIMEOUT=600
QP_CHECK_ARGS="--interp-runs 10"
