# quickproof config for leanos_enum (quickproof/tools/clight.sh).  The code under test is boot/pci-enumeration.h of
# LeanOS, compiled unchanged into the wrapper unit patch/enum_unit.c.
LINK=per-law
INC=(-I. -Ipatch -Iboot -isystem "$(gcc -print-file-name=include)")
DEFS=()
UNITS=(
  "patch/enum_unit.c=src/enum"
  "$GP/libc/libc.c=src/libc"
  "$GP/libc/malloc_unit.c=src/malloc"
)
