# quickproof config for leanos_caps (quickproof/tools/clight.sh).  The code under test is boot/pci-capabilities.h of
# LeanOS, compiled unchanged into the wrapper unit patch/caps_unit.c.
LINK=per-law
INC=(-I. -Ipatch -Iboot -isystem "$(gcc -print-file-name=include)")
DEFS=()
UNITS=(
  "patch/caps_unit.c=src/caps"
  "$GP/libc/libc.c=src/libc"
  "$GP/libc/malloc_unit.c=src/malloc"
)
