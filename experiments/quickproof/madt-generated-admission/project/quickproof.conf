# quickproof config for leanos_madt_admission (quickproof/tools/clight.sh).  The code under test is
# include/madt_generated_admission.h of LeanOS, compiled unchanged into the wrapper unit
# patch/madt_admission_unit.c, with the shim patch/boundary-abi.h for the generated export header.
LINK=per-law
INC=(-I. -Ipatch -Iinclude -isystem "$(gcc -print-file-name=include)")
DEFS=()
UNITS=(
  "patch/madt_admission_unit.c=src/madt_admission"
  "$GP/libc/libc.c=src/libc"
  "$GP/libc/malloc_unit.c=src/malloc"
)
