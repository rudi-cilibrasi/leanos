# qp check settings for scripts/check-quickproof.sh (parsed, not sourced).
# qp check samples 40 live mutants by default; -k 209 runs every one of the
# 209 mutation sites of include/madt_generated_admission.h (206 live
# mutants), so the kill count the gate compares with CHECK.md covers the
# whole header. The interpreter's slowest of 40 seeds takes about 2.3 s of
# the default 10 s, so the default stays.
QP_CHECK_ARGS="-k 209"
