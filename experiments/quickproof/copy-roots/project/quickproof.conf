# quickproof config for leanos_roots (quickproof/tools/clight.sh).  The code under test is the two headers
# include/qotom_copy_root_builder.h and include/frame_copy_window.h of LeanOS, compiled unchanged into the wrapper
# unit patch/roots_unit.c.
LINK=per-law
INC=(-I. -Ipatch -Iinclude -isystem "$(gcc -print-file-name=include)")
DEFS=()
UNITS=(
  "patch/roots_unit.c=src/roots"
  "$GP/libc/libc.c=src/libc"
  "$GP/libc/malloc_unit.c=src/malloc"
)
