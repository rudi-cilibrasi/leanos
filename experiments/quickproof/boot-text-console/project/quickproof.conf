# quickproof config for leanos_console (quickproof/tools/clight.sh).  The code under test is the header
# include/boot_text_console.h of LeanOS, included by the harness.  patch/ holds the reviewed model of the one
# Lean export the header calls and a shim for the generated boundary-abi.h, which declares only that export.
LINK=per-law
INC=(-I. -Ipatch -Iinclude -isystem "$(gcc -print-file-name=include)")
DEFS=(-Dvolatile=)   # DEVIATIONS.md D1: VST cannot reason about volatile accesses
UNITS=(
  "patch/lean_export_model.c=src/model"
  "patch/console_unit.c=src/console"
  "$GP/libc/libc.c=src/libc"
  "$GP/libc/malloc_unit.c=src/malloc"
)
