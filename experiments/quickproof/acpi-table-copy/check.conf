# qp check settings for scripts/check-quickproof.sh (parsed, not sourced).
# qp check samples 40 live mutants by default; -k 221 runs every one of the
# 221 mutation sites of include/acpi_table_copy.h (218 live mutants), so the
# kill count the gate compares with CHECK.md covers the whole header. The
# interpreter's slowest seed takes about 5 s of the default 10 s on an idle
# machine; each seed gets 30 s, for a loaded one.
GP_INTERP_TIMEOUT=30
QP_CHECK_ARGS="-k 221"
