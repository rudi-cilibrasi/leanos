# quickproof config for leanos_acpi (quickproof/tools/clight.sh).  The code under test is
# include/acpi_table_copy.h of LeanOS, compiled unchanged into the wrapper unit patch/acpi_unit.c, with the shim
# patch/boundary-abi.h for the generated export header.
LINK=per-law
INC=(-I. -Ipatch -Iinclude -isystem "$(gcc -print-file-name=include)")
DEFS=()
UNITS=(
  "patch/acpi_unit.c=src/acpi"
  "$GP/libc/libc.c=src/libc"
  "$GP/libc/malloc_unit.c=src/malloc"
)
