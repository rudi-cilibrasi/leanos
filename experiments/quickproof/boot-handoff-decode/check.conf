# qp check settings for scripts/check-quickproof.sh (parsed, not sourced).
# qp check samples 40 live mutants by default; -k 431 runs every one of the
# 431 mutation sites of include/boot_handoff_decode.h (417 live mutants), so
# the kill count the gate compares with CHECK.md covers the whole header. An
# allocation or a copy alone fills and compares its 8192-word copy in about
# 5 s under the interpreter, and its slowest seed takes about 7 s of the
# default 10 s on a loaded machine; each seed gets 30 s.
GP_INTERP_TIMEOUT=30
QP_CHECK_ARGS="-k 431"
