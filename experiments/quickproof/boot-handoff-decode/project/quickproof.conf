# quickproof config for leanos_handoff (quickproof/tools/clight.sh).  The code under test is
# include/boot_handoff_decode.h of LeanOS, compiled unchanged into the wrapper unit patch/handoff_unit.c, with the
# shim patch/boundary-abi.h for the generated export header.
LINK=per-law
INC=(-I. -Ipatch -Iinclude -isystem "$(gcc -print-file-name=include)")
DEFS=()
UNITS=(
  "patch/handoff_unit.c=src/handoff"
  "$GP/libc/libc.c=src/libc"
  "$GP/libc/malloc_unit.c=src/malloc"
)
