# quickproof config for leanos_frame_selection (quickproof/tools/clight.sh).  The code under test is
# include/boot_frame_selection.h of LeanOS, compiled unchanged into the wrapper unit patch/frame_unit.c, with the
# shim patch/boundary-abi.h for the generated export header.
LINK=per-law
INC=(-I. -Ipatch -Iinclude -isystem "$(gcc -print-file-name=include)")
DEFS=()
UNITS=(
  "patch/frame_unit.c=src/frame"
  "$GP/libc/libc.c=src/libc"
  "$GP/libc/malloc_unit.c=src/malloc"
)
