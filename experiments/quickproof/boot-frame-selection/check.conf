# qp check settings for scripts/check-quickproof.sh (parsed, not sourced).
# qp check samples 40 live mutants by default; -k 195 runs every one of the
# 195 mutation sites of include/boot_frame_selection.h and its wrapper unit
# (191 live mutants), so the kill count the gate compares with CHECK.md covers
# the whole header. An allocation seed asks 265 overlay and terminal words and
# compares every object after each of its seven steps; under the interpreter
# it takes about 5 s of the default 10 s on a loaded machine, so each seed
# gets 30 s.
GP_INTERP_TIMEOUT=30
QP_CHECK_ARGS="-k 195"
