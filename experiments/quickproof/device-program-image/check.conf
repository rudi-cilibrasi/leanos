# qp check settings for scripts/check-quickproof.sh (parsed, not sourced).
# qp check samples 40 live mutants by default; -k 282 runs every one of the
# 282 mutation sites of hardware/wifi/wifi-exec.h (259 live mutants; the rest
# compile to the same object), so the kill count the gate compares with
# CHECK.md covers the whole header. Each mutant gets 1000 native runs instead
# of 300: the plan has 80 scenarios, and some checks are reached by one value
# of a scenario only. A wifi_start seed fills, copies and compares the 256 KiB
# executor scratch; under the interpreter it takes about 27 s (other seeds
# under 1 s), so each seed gets 90 s.
GP_INTERP_TIMEOUT=90
QP_CHECK_ARGS="-k 282 --mutant-runs 1000"
