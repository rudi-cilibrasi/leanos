# quickproof config for leanos_device_program_image (quickproof/tools/clight.sh).  The code under test is
# hardware/wifi/wifi-exec.h of LeanOS, compiled unchanged into the wrapper unit patch/device_program_unit.c.
# DEVIATIONS.md D2: VST cannot reason about volatile accesses, so volatile is defined away.
LINK=per-law
INC=(-I. -Ipatch -Ihardware/wifi -isystem "$(gcc -print-file-name=include)")
DEFS=(-Dvolatile=)
UNITS=(
  "patch/device_program_unit.c=src/device_program"
  "$GP/libc/libc.c=src/libc"
  "$GP/libc/malloc_unit.c=src/malloc"
)
