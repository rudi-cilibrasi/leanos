# Embedded in the ISO's UEFI GRUB (scripts/build-efi-grub.sh).  Firmware
# loads it from the El Torito FAT image, which holds no configuration, so
# find the ISO 9660 tree that carries the kernel and use its grub.cfg: the
# same file BIOS GRUB reads.
search --no-floppy --file --set=root /boot/leanos.elf
set prefix=($root)/boot/grub
configfile $prefix/grub.cfg
